[package]
name = "polycopy-engine"
version = "0.1.0"
edition = "2021"
description = "Safety-first Polymarket copy-execution engine"
publish = false

[features]
default = []
intl_clob = [
    "dep:alloy",
    "dep:async-trait",
    "dep:futures-util",
    "dep:polymarket_client_sdk_v2",
    "polymarket_client_sdk_v2/clob",
    "dep:tokio",
]
db = [
    "dep:sqlx",
    "dep:tokio",
]
ingest = [
    "db",
    "dep:arc-swap",
    "dep:polymarket_client_sdk_v2",
    "polymarket_client_sdk_v2/data",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:rustls",
    "tokio/rt-multi-thread",
    "tokio/time",
    "tokio/net",
]
execute = [
    "db",
    "intl_clob",
    "tokio/rt-multi-thread",
    "tokio/time",
]
# Independent of both `ingest` (leader-activity ingestion) and `execute`
# (the copy-order lifecycle): this only reads the account's own row, polls
# Polymarket's read-only positions endpoint, and reads position_lots. No
# signer, no order adapter, nothing from intl_clob anywhere in its import
# graph -- see redemption.rs's module doc.
redeem_detect = [
    "db",
    "dep:polymarket_client_sdk_v2",
    "polymarket_client_sdk_v2/data",
    "dep:rustls",
]
copy_run = [
    "execute",
    "ingest",
]
# Read-only terminal dashboard. Needs `execute` (which implies `intl_clob`)
# solely for the same derive-only-authenticated balance read every other
# operator tool already does (see persistent_control/ghost_verify) -- the
# binary itself never imports orchestrate/reconcile/execute_intent, but
# unlike redeem_detect/ingest this cannot be architecturally proven at the
# feature-gate level, since `execute` is on regardless.
dashboard = [
    "execute",
    "dep:ratatui",
]

[dependencies]
# Version pinned to the same requirement polymarket_client_sdk_v2 itself
# uses, so Cargo unifies on the one already-resolved copy instead of a
# second, possibly-incompatible one. Only `dyn-abi` and `sol-types` are
# needed: `Eip712Domain` and `SolStruct::eip712_signing_hash` are what
# `order_hash.rs` uses to compute an order ID offline, mirroring the exact
# digest the SDK's own (private) `sign()` method already computes for
# signing but never returns to the caller.
alloy = { version = "1.6.3", default-features = false, features = ["dyn-abi", "sol-types"], optional = true }
arc-swap = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
# Needed by both intl_clob (canary_probe's timestamps) and ingest
# (normalize.rs's occurred_at formatting), so not optional -- see the same
# reasoning already applied to serde below.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4.3"
futures-util = { version = "0.3", default-features = false, optional = true }
# Fixed official 0.7.0 source (commit 222143d).  The local patch only makes
# optional trade-fee metadata resilient to the venue's documented-in-practice
# empty-string response; execution-critical fields remain strict.
polymarket_client_sdk_v2 = { path = "vendor/polymarket_client_sdk_v2_source", default-features = false, optional = true }
# "crossterm" is the terminal backend; ratatui re-exports the crate as
# `ratatui::crossterm` so this project does not also declare crossterm
# itself as a separate top-level dependency.
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm"], optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Only needed to call CryptoProvider::install_default() once at startup:
# rustls 0.23+ no longer picks a default crypto backend on its own, and
# without this every TLS connect (including tokio-tungstenite's) blocks/panics.
# Version and backend (aws-lc-rs) pinned to match what tokio-tungstenite
# already resolves transitively, so this doesn't pull in a second backend.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"], optional = true }
# canary.rs (unconditionally compiled) needs these regardless of which
# venue/storage feature is enabled, so they are not optional.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"], optional = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt"], optional = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
